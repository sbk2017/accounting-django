{% extends 'base.html' %}{% block title %}Sign in{% endblock %}{% block content %}<section><h1>Sign in</h1>{% if form.errors %}<p class="msg error">Incorrect username or password. Check the server log if sign-in continues to fail.</p>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><label>Username <input name="username" autocomplete="username" required></label><label>Password <input type="password" name="password" autocomplete="current-password" required></label><button>Sign in</button></form></section>{% endblock %}
