<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Accounting{% endblock %}</title><style>body{margin:0;background:#f3f6f9;color:#1d3143;font:15px system-ui,sans-serif}header{background:#173247;color:white;padding:16px 3vw}nav{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}a{color:#147486}nav a{color:#c2f2f1;text-decoration:none}main{max-width:1200px;margin:24px auto;padding:0 18px}section{background:white;border:1px solid #dde5ec;padding:20px;border-radius:10px;margin:16px 0;overflow-x:auto}h1,h2{margin-top:0}table{border-collapse:collapse;width:100%;min-width:580px}th,td{border-bottom:1px solid #e5ebef;padding:9px;text-align:left}input,select,textarea,button{font:inherit;padding:8px;border:1px solid #b6c5d0;border-radius:5px;max-width:100%;box-sizing:border-box;margin:4px}button{background:#147486;color:white;cursor:pointer;border:0}.cards{display:flex;gap:15px;flex-wrap:wrap}.cards section{min-width:170px;flex:1}.msg{padding:12px;background:#e1f4eb;border-radius:6px;margin:10px 0}.error{background:#ffdddd}small{color:#607081}label{display:inline-block;margin:5px}</style></head><body><header><strong>Local Accounting</strong>{% if user.is_authenticated %}<nav><a href="{% url 'dashboard' %}">Dashboard</a><a href="{% url 'accounts' %}">Accounts</a><a href="{% url 'journals' %}">Journals</a><a href="{% url 'recurring' %}">Recurring</a><a href="{% url 'imports' %}">Imports</a><a href="{% url 'bank' %}">Bank</a><a href="{% url 'reports' %}">Reports</a><a href="{% url 'settings' %}">Settings</a><a href="/admin/">Admin</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Log out</button></form></nav>{% endif %}</header><main>{% for message in messages %}<div class="msg {% if message.tags == 'error' %}error{% endif %}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
