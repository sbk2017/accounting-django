{% extends 'base.html' %}{% block content %}<h1>Settings</h1><section><form method="post">{% csrf_token %}{% for s in settings %}<label>{{ s.key }} <input name="{{ s.key }}" value="{{ s.value }}"></label><br>{% endfor %}<button>Save</button></form></section><section><h2>Lock accounting month</h2><form method="post">{% csrf_token %}<input type="hidden" name="kind" value="lock"><input type="month" name="month" required><button>Lock</button></form><p>Locked: {% for p in periods %}{{ p.month }} {% endfor %}</p></section>{% endblock %}
